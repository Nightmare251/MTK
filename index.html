<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Matematika SAS Juni 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
  #start-screen, #quiz-screen, #result-screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  #start-screen { display: flex; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
  .logo-area { text-align: center; margin-bottom: 30px; }
  .logo-area h1 { font-size: 2.5em; font-weight: 800; color: #fff; text-shadow: 0 0 30px rgba(100,200,255,0.5); }
  .logo-area p { color: #aaa; margin-top: 8px; font-size: 1.1em; }
  .badge { display: inline-block; background: #7c3aed; color: #fff; padding: 6px 18px; border-radius: 20px; font-size: 0.85em; margin-bottom: 16px; }
  .start-btn { background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff; border: none; padding: 18px 60px; font-size: 1.3em; font-weight: 700; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 32px rgba(124,58,237,0.5); transition: all 0.2s; margin-top: 20px; letter-spacing: 1px; }
  .start-btn:hover { transform: scale(1.05); box-shadow: 0 12px 40px rgba(124,58,237,0.7); }
  #quiz-screen { background: #1a1a2e; padding: 0; }
  .quiz-header { width: 100%; background: #16213e; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #0f3460; flex-shrink: 0; }
  .q-counter { font-size: 0.95em; color: #aaa; font-weight: 600; }
  .q-number { font-size: 1.2em; font-weight: 800; color: #7c3aed; }
  .score-display { background: #7c3aed; padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 1em; }
  .timer-bar-wrap { width: 100%; height: 6px; background: #0f3460; }
  .timer-bar { height: 6px; background: linear-gradient(90deg, #10b981, #3b82f6); transition: width 0.1s linear; border-radius: 0 3px 3px 0; }
  .quiz-content { flex: 1; width: 100%; max-width: 860px; margin: 0 auto; padding: 24px 20px; overflow-y: auto; }
  .question-text { background: #16213e; border-radius: 16px; padding: 20px 24px; margin-bottom: 16px; font-size: 1.05em; line-height: 1.7; border: 1px solid #0f3460; }
  .question-text img { max-width: 100%; border-radius: 10px; margin: 12px 0; display: block; }
  .q-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.95em; }
  .q-table th, .q-table td { border: 1px solid #0f3460; padding: 7px 14px; text-align: center; }
  .q-table th { background: #0f3460; color: #7dd3fc; font-weight: 700; }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .options-grid { grid-template-columns: 1fr; } }
  .option-btn { background: #16213e; border: 2px solid #0f3460; border-radius: 14px; padding: 16px 20px; color: #eee; font-size: 1em; cursor: pointer; text-align: left; transition: all 0.2s; display: flex; align-items: center; gap: 12px; line-height: 1.5; }
  .option-btn:hover:not(:disabled) { border-color: #7c3aed; background: #1e1b4b; transform: translateY(-2px); }
  .option-btn.correct { background: #064e3b; border-color: #10b981; color: #6ee7b7; }
  .option-btn.wrong { background: #4c0519; border-color: #f43f5e; color: #fda4af; }
  .option-label { width: 36px; height: 36px; border-radius: 50%; background: #0f3460; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9em; flex-shrink: 0; }
  .option-btn.correct .option-label { background: #10b981; color: #fff; }
  .option-btn.wrong .option-label { background: #f43f5e; color: #fff; }
  .next-area { text-align: center; margin-top: 20px; }
  .next-btn { background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff; border: none; padding: 14px 48px; font-size: 1em; font-weight: 700; border-radius: 30px; cursor: pointer; display: none; transition: all 0.2s; }
  .next-btn:hover { transform: scale(1.04); }
  .feedback-msg { margin-top: 14px; font-size: 0.95em; line-height: 1.6; min-height: 24px; padding: 0 4px; }
  .feedback-msg.correct { color: #10b981; }
  .feedback-msg.wrong { color: #f43f5e; }
  #result-screen { display: none; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
  .result-box { background: #16213e; border-radius: 24px; padding: 40px; text-align: center; max-width: 480px; width: 100%; border: 2px solid #0f3460; }
  .result-emoji { font-size: 4em; margin-bottom: 16px; }
  .result-score { font-size: 3.5em; font-weight: 900; color: #7c3aed; }
  .result-label { color: #aaa; margin-top: 8px; font-size: 1em; }
  .result-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0; }
  .stat-card { background: #0f3460; border-radius: 12px; padding: 16px; }
  .stat-num { font-size: 1.8em; font-weight: 800; }
  .stat-lbl { font-size: 0.8em; color: #aaa; margin-top: 4px; }
  .stat-card.correct { border-top: 3px solid #10b981; }
  .stat-card.wrong { border-top: 3px solid #f43f5e; }
  .restart-btn { background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff; border: none; padding: 16px 52px; font-size: 1.1em; font-weight: 700; border-radius: 30px; cursor: pointer; margin-top: 10px; width: 100%; }
  .progress-dots { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; margin-top: 20px; max-width: 860px; padding: 0 20px 20px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #0f3460; }
  .dot.done-correct { background: #10b981; }
  .dot.done-wrong { background: #f43f5e; }
  .dot.current { background: #7c3aed; box-shadow: 0 0 8px #7c3aed; }
</style>
</head>
<body>

<div id="start-screen">
  <div class="logo-area">
    <div class="badge">📐 MATEMATIKA</div>
    <h1>Kuis SAS</h1>
    <p>Juni 2026 — 27 Soal Lengkap</p>
  </div>
  <p style="color:#aaa; max-width:360px; text-align:center; font-size:0.95em; margin-top:8px;">Setiap bermain, urutan pilihan jawaban diacak — tapi jawaban benar tetap sama! Waktu 30 detik per soal.</p>
  <button class="start-btn" onclick="startQuiz()">🚀 MULAI KUIS</button>
</div>

<div id="quiz-screen">
  <div class="quiz-header">
    <div>
      <div class="q-counter" id="q-counter">Soal 1 dari 27</div>
      <div class="q-number" id="q-number">01</div>
    </div>
    <div class="score-display">⭐ <span id="score">0</span></div>
  </div>
  <div class="timer-bar-wrap"><div class="timer-bar" id="timer-bar"></div></div>
  <div style="display:flex; justify-content:center; flex:1; width:100%;">
    <div class="quiz-content">
      <div class="question-text" id="question-text"></div>
      <div class="options-grid" id="options-grid"></div>
      <div class="feedback-msg" id="feedback-msg"></div>
      <div class="next-area"><button class="next-btn" id="next-btn" onclick="nextQuestion()">Soal Berikutnya ➜</button></div>
    </div>
  </div>
  <div class="progress-dots" id="progress-dots"></div>
</div>

<div id="result-screen">
  <div class="result-box">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <div class="result-score" id="final-score">0 poin</div>
    <div class="result-label">Skor akhir kamu</div>
    <div class="result-stats">
      <div class="stat-card correct"><div class="stat-num" id="r-correct">0</div><div class="stat-lbl">✅ Benar</div></div>
      <div class="stat-card wrong"><div class="stat-num" id="r-wrong">0</div><div class="stat-lbl">❌ Salah</div></div>
    </div>
    <button class="restart-btn" onclick="restartQuiz()">🔄 Ulangi Kuis</button>
  </div>
</div>

let currentQ = 0, score = 0, correctCount = 0, wrongCount = 0;
let answered = false, dotStates = [], timerInterval = null, timeLeft = 30;

function shuffle(arr) {
  let a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    let j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz() {
  document.getElementById('start-screen').style.display = 'none';
  const qs = document.getElementById('quiz-screen');
  qs.style.display = 'flex'; qs.style.flexDirection = 'column';
  currentQ = 0; score = 0; correctCount = 0; wrongCount = 0;
  dotStates = new Array(QUESTIONS.length).fill('pending');
  buildDots(); showQuestion();
}

function buildDots() {
  const d = document.getElementById('progress-dots');
  d.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i===currentQ?' current':'');
    dot.id = 'dot-'+i;
    d.appendChild(dot);
  });
}

function updateDots() {
  QUESTIONS.forEach((_, i) => {
    const dot = document.getElementById('dot-'+i);
    if (!dot) return;
    dot.className = 'dot';
    if (dotStates[i]==='correct') dot.classList.add('done-correct');
    else if (dotStates[i]==='wrong') dot.classList.add('done-wrong');
    else if (i===currentQ) dot.classList.add('current');
  });
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 30;
  const bar = document.getElementById('timer-bar');
  bar.style.width = '100%';
  timerInterval = setInterval(() => {
    timeLeft--;
    bar.style.width = (timeLeft/30*100) + '%';
    if (timeLeft <= 0) { clearInterval(timerInterval); if (!answered) autoSkip(); }
  }, 1000);
}

function autoSkip() {
  answered = true;
  dotStates[currentQ] = 'wrong'; updateDots();
  document.querySelectorAll('.option-btn').forEach(b => { b.disabled = true; });
  const q = QUESTIONS[currentQ];
  document.querySelectorAll('.option-btn').forEach(b => {
    if (b.dataset.label === q.answer) b.classList.add('correct');
  });
  const fb = document.getElementById('feedback-msg');
  fb.textContent = '⏱ Waktu habis! ' + q.explanation;
  fb.className = 'feedback-msg wrong';
  document.getElementById('next-btn').style.display = 'inline-block';
}

function showQuestion() {
  answered = false;
  const q = QUESTIONS[currentQ];
  document.getElementById('q-counter').textContent = `Soal ${currentQ+1} dari ${QUESTIONS.length}`;
  document.getElementById('q-number').textContent = String(currentQ+1).padStart(2,'0');
  document.getElementById('score').textContent = score;
  document.getElementById('feedback-msg').textContent = '';
  document.getElementById('feedback-msg').className = 'feedback-msg';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('question-text').innerHTML = q.q;
  
  const shuffled = shuffle(q.options);
  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  const displayLabels = ['A','B','C','D'];
  shuffled.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.dataset.label = opt.label;
    btn.innerHTML = `<span class="option-label">${displayLabels[i]}</span>${opt.text}`;
    btn.onclick = () => selectAnswer(opt.label, btn, q);
    grid.appendChild(btn);
  });
  updateDots(); startTimer();
}

function selectAnswer(chosen, btn, q) {
  if (answered) return;
  answered = true; clearInterval(timerInterval);
  const isCorrect = chosen === q.answer;
  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (b.dataset.label === q.answer) b.classList.add('correct');
  });
  const fb = document.getElementById('feedback-msg');
  if (isCorrect) {
    btn.classList.add('correct');
    score += 100; correctCount++;
    dotStates[currentQ] = 'correct';
    fb.textContent = '✅ Benar! ' + q.explanation;
    fb.className = 'feedback-msg correct';
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    dotStates[currentQ] = 'wrong';
    fb.textContent = '❌ Salah. ' + q.explanation;
    fb.className = 'feedback-msg wrong';
  }
  updateDots();
  document.getElementById('score').textContent = score;
  document.getElementById('next-btn').style.display = 'inline-block';
}

function nextQuestion() {
  if (currentQ < QUESTIONS.length - 1) { currentQ++; showQuestion(); }
  else showResult();
}

function showResult() {
  document.getElementById('quiz-screen').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'flex'; rs.style.flexDirection = 'column';
  const pct = correctCount / QUESTIONS.length;
  document.getElementById('result-emoji').textContent = pct >= 0.9 ? '🏆' : pct >= 0.7 ? '🎉' : pct >= 0.5 ? '👍' : '📚';
  document.getElementById('final-score').textContent = score + ' poin';
  document.getElementById('r-correct').textContent = correctCount;
  document.getElementById('r-wrong').textContent = wrongCount;
}

function restartQuiz() {
  document.getElementById('result-screen').style.display = 'none';
  startQuiz();
}
</script>
</body>
</html>
